<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body>
    <div style="display: flex; flex-direction: row;">
       <div class="container1">
         <label class="label" for="temperature">Please enter your desired temperature</label>
         <input type="number" id="numbers"/>
         <label for="unit">Please select your current temperature unit</label>
         <select id="type" class="currentdegree">
             <option value="celsius">Celsius</option>
             <option value="farenheit">Farenheit</option>
             <option value="kelvin">Kelvin</option>
         </select>
         <label for="unit">Please select your converting temperature unit</label>
         <select id="type" class="convertdegree">
             <option value="celsius">Celsius</option>
             <option value="farenheit">Farenheit</option>
             <option value="kelvin">Kelvin</option>
         </select>
         <button class="button">Convert</button>
         
       </div>
       <div class="container2">
           <p  class="value">32</p>
       </div>
    </div>
    <script src="temp.js"></script>
</body>
</html>
